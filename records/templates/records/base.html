<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Показатели здоровья{% endblock %}</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'records:home' %}">🩺 Показатели здоровья</a>
        <div class="navbar-nav">
            <a class="nav-link" href="{% url 'records:home' %}">Главная</a>
            <a class="nav-link" href="{% url 'records:create' %}">Создать запись</a>
            <a class="nav-link" href="{% url 'records:upload' %}">Загрузить файл</a>
            <a class="nav-link" href="{% url 'records:view_data' %}">Просмотреть данные</a>
        </div>
    </div>
</nav>

<div class="container pb-5">
    {% if messages %}
        {% for message in messages %}
            <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-success{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
</div>
</body>
</html>
